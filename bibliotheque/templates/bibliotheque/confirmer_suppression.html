{% extends 'bibliotheque/base.html' %}
{% block title %}Supprimer{% endblock %}
{% block content %}
<div class="card border-danger" style="max-width:500px; margin:auto;">
  <div class="card-header bg-danger text-white"><h5>Confirmer la suppression</h5></div>
  <div class="card-body text-center">
    <p>Voulez-vous vraiment supprimer le livre <strong>« {{ livre.titre }} »</strong> ?</p>
    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger me-2">Oui, supprimer</button>
      <a href="{% url 'liste_livres' %}" class="btn btn-secondary">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
