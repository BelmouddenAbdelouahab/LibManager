{% extends 'bibliotheque/base.html' %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card" style="max-width:400px; margin:auto;">
  <div class="card-header text-center"><h5><i class="fas fa-sign-in-alt me-2"></i>Connexion</h5></div>
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Nom d'utilisateur</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mot de passe</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
    <p class="text-center mt-3">Pas encore inscrit ? <a href="{% url 'inscription' %}">Créer un compte</a></p>
  </div>
</div>
{% endblock %}
