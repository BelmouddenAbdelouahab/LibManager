{% extends 'bibliotheque/base.html' %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px; margin:auto;">
  <div class="card-header"><h5>{{ titre }}</h5></div>
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{% url 'liste_livres' %}" class="btn btn-secondary ms-2">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
